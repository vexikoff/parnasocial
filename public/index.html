<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../assets/style.css">
    <title>Parnasocial</title>
</head>
<body>
    <div class="grad"></div>
    <header class="header">
        <div class="iconp">
            <img class="img" src="../assets/Parnasocial_mini18.png" alt="Пожалуйста, перезагрузите страницу (Ctrl + R)">
            <h1>Parnasocial</h1>
            <div class="nav">
                <button class="file file111" id="file">File</button>
            </div>
        </div>
        <div class="right">
            <button class="segoe" onclick="openset()">&#xE713;</button>
        </div>
    </header>
    <div class="filess hidden" id="files">
        <button class="file row">
            <span class="segoeplus">&#xE8B7;</span>
            Open
        </button>
        <button class="file row not">
            Recent
            <span class="segoeplus rrd">&#xE76C;</span>
        </button>
        <button class="file row not">
            Exit
        </button>
    </div>
    <div class="recentt hidden">
        <button class="file row">
            Parnasocial
        </button>
    </div>
    <div class="main">
        <div class="left">
            <div class="top">
                <input type="search" name="folder" id="srcc" class="search skr">
                <button class="segoeplus button" id="openfolder">&#xE838;</button>
                <button class="segoeplus button" id="repeatfolder">&#xF5E7;</button>
                <button class="segoeplus button" id="shufflefolder">&#xE8B1;</button>
                <button class="segoeplus button" id="foldertoplaylist">&#xE8DE;</button>
                <button class="segoeplus button" id="srch">&#xE721;</button>
            </div>
            <div class="spacer"></div>
            <div class="directory">
                <div class="folder">
                    <div class="row">
                        <p class="segoeplus" id="skr1">&#xE70D;</p>
                        <p class="segoeplus">&#xE838;</p>
                        <p class="foldername">Folder name</p>
                    </div>
                    <div class="spacer"></div>
                    <div class="folder">
                        <div class="row">
                            <p class="segoeplus" id="raskr1">&#xE76C;</p>
                            <p class="segoeplus">&#xE8B7;</p>
                            <p class="foldername">Folder name</p>
                        </div>
                    </div>
                    <div class="file">
                        <div class="row">
                            <p class="segoeplus">&#xE9CE;</p>
                            <p class="foldername">File name</p>
                        </div>
                    </div>
                    <div class="folder">
                        <div class="row">
                            <p class="segoeplus" id="raskr21">&#xE76C;</p>
                            <p class="segoeplus">&#xE8B7;</p>
                            <p class="foldername">Folder name</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="center">
            <div class="row">
                <h1>Hello, </h1>
                <h1 id="name"></h1>
            </div>
            <div class="player">
                <div class="prew">
                    <img src="../assets/pre.png" class="playerimg" id="playerimg">
                    <div class="timecont"><div class="time" id="time"></div></div>
                </div>
                <div class="row">
                    <button class="segoeplus pr" id="videomode">&#xE714;</button>
                    <button class="segoeplus pr" id="back">&#xE892;</button>
                    <button class="segoeplus play" id="play">&#xE768;</button>
                    <button class="segoeplus pr" id="next">&#xE893;</button>
                    <div class="row volumep">
                        <button class="segoeplus pr" id="volumepok">&#xE995;</button>
                        <input type="range" min="0" max="100" value="70" step="1" class="volume" id="volume" >
                    </div>
                </div>

            </div>
        </div>
        <div class="right">
            <div class="top topp">
                <input type="search" name="folder" id="srccp" class="search skr">
                <button class="segoeplus button" id="openplaylist">&#xE8DA;</button>
                <button class="segoeplus button" id="repeatplaylist">&#xF5E7;</button>
                <button class="segoeplus button" id="shuffleplaylist">&#xE8B1;</button>
                <button class="segoeplus button" id="addplaylist">&#xE710;</button>
                <button class="segoeplus button" id="addfolderplaylist">&#xE8F4;</button>
                <button class="segoeplus button" id="srchp">&#xE721;</button>
            </div>
            <div class="spacer"></div>
            <div class="playlist">
                <div class="folder">
                    <div class="row">
                        <p class="segoeplus" id="skr">&#xE70D;</p>
                        <p class="segoeplus">&#xE838;</p>
                        <p class="foldername">Folder name</p>
                    </div>
                    <div class="spacer"></div>
                    <div class="folder">
                        <div class="row">
                            <p class="segoeplus" id="raskr">&#xE76C;</p>
                            <p class="segoeplus">&#xE8B7;</p>
                            <p class="foldername">Folder name</p>
                        </div>
                    </div>
                    <div class="file">
                        <div class="row">
                            <p class="segoeplus">&#xE90B;</p>
                            <p class="foldername">File name</p>
                        </div>
                    </div>
                    <div class="folder">
                        <div class="row">
                            <p class="segoeplus" id="raskr2">&#xE76C;</p>
                            <p class="segoeplus">&#xE8B7;</p>
                            <p class="foldername">Folder name</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="settings vniz">
        <div class="main">
            <h1>Settings</h1>
            <div class="row">
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
                <p>Dark theme</p>
            </div>
            <p>Developers:</p>
            <a href="https://github.com/vexikoff">vexikoff</a>
            <a href="https://github.com/darksputnik">dark sputnik</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
