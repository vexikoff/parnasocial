<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../assets/style.css">
    <title>Parnasocial</title>
</head>
<body>
    <div class="grad"></div>
    <header class="header">
        <div class="iconp">
            <img class="img" src="../assets/Parnasocial_mini18.png" alt="Пожалуйста, перезагрузите страницу (Ctrl + R)">
            <h1>Parnasocial</h1>
        </div>
        <div class="right">
            <button class="segoe" onclick="openset()">&#xE713;</button>
        </div>
    </header>
    <div class="main">
        <div class="left">
            <div class="top">
                <input type="search" name="folder" id="searchfolderinp" class="search skr">
                <button class="segoeplus button" id="openfolder">&#xE838;</button>
                <button class="segoeplus button" id="repeatfolder">&#xF5E7;</button>
                <button class="segoeplus button" id="shufflefolder">&#xE8B1;</button>
                <button class="segoeplus button" id="foldertoplaylist">&#xE8DE;</button>
                <button class="segoeplus button" id="searchfolder">&#xE721;</button>
            </div>
            <div class="spacer"></div>
        </div>
        <div class="center">
            <div class="row">
                <h1>Здравствуйте, </h1>
                <h1 id="name"></h1>
            </div>
            <div class="player">
                <div class="prew"></div>
                <div class="row">
                    <button class="segoeplus pr">&#xE892;</button>
                    <button class="segoeplus play">&#xE768;</button>
                    <button class="segoeplus pr">&#xE893;</button>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="top">
                <button class="segoeplus button" id="openplaylist">&#xE8DA;</button>
                <button class="segoeplus button" id="repeatplaylist">&#xF5E7;</button>
                <button class="segoeplus button" id="shuffleplaylist">&#xE8B1;</button>
                <button class="segoeplus button" id="addplaylist">&#xE710;</button>
                <button class="segoeplus button" id="addfolderplaylist">&#xE8F4;</button>
                <button class="segoeplus button" id="searchplaylist">&#xE721;</button>
            </div>
            <div class="spacer"></div>
        </div>
    </div>
    <div class="settings vniz">
        <div class="main">
            <h1>Settings</h1>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
