<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../assets/style.css">
    <link rel="stylesheet" href="../assets/fullscreen.css">
    <title>Parnasocial</title>
</head>
<body>
<div class="grad"></div>
<header class="header">
    <div class="iconp">
        <img class="img" src="../assets/Parnasocial_mini18.png" alt="Пожалуйста, перезагрузите страницу (Ctrl + R)">
        <h1>Parnasocial</h1>
    </div>
    <div class="right">
        <button class="segoe" onclick="openset()">&#xE713;</button>
    </div>
</header>
<div class="main">
    <video class="video" src="" id="video"></video>
    <div class="controls">
        <div class="timecont"><div class="time" id="time"></div></div>
        <button class="segoeplus pr" id="back">&#xE892;</button>
        <button class="segoeplus play" id="play">&#xE768;</button>
        <button class="segoeplus pr" id="next">&#xE893;</button>
        <button class="segoeplus pr" id="backtoaudio">&#xE8D6;</button>
        <div class="row volumep">
            <button class="segoeplus pr" id="volumepok">&#xE995;</button>
            <input type="range" min="0" max="100" value="70" step="1" class="volume" id="volume" >
        </div>
        <button class="segoeplus pr rightss" id="fullscreen">&#xE92D;</button>
    </div>
</div>
<div class="settings vniz">
    <div class="main">
        <h1>Settings</h1>
        <h3>System</h3>
        <div class="row">
            <label class="switch switchss">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
            <p>Dark theme</p>
        </div>
        <div class="row">
            <label class="switch switchsss">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
            <p>Start with windows</p>
        </div>
        <div class="row">
            <label class="switch switchccc">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
            <p>Save playlist</p>
        </div>
        <div class="row">
            <label class="switch switchccc">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
            <p>Keep in tray after closing</p>
        </div>
        <div class="row">
            <label class="switch switchcc">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
            <p>Crossfade</p>
        </div>
        <h3>Audio mode</h3>
        <div class="row">
            <label class="switch switchsssss">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
            <p>Video preview</p>
        </div>
        <div class="row">
            <label class="switch switchssssss">
                <input type="checkbox" disabled>
                <span class="slider"></span>
            </label>
            <p>Auto ratio</p>
        </div>
        <p>Developers:</p>
        <a href="https://github.com/vexikoff">vexikoff</a>
        <a href="https://github.com/darksputnik">dark sputnik</a>
    </div>
</div>
<script src="fullscreen.js"></script>
</body>
</html>
